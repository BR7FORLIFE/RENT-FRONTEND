services:
  app:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

  test:
    build: .
    profiles: ["test"]
    command: ["pnpm", "exec", "vitest", "run"]
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
